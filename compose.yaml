services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tournamentiq
      POSTGRES_USER: tournamentiq
      POSTGRES_PASSWORD: tournamentiq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tournament-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournamentiq -d tournamentiq"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tournamentiq
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/tournaments"]
      interval: 3s
      timeout: 3s
      retries: 15

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tournament-data:
