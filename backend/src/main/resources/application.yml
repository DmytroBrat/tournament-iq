spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tournamentiq}
    username: ${DATABASE_USER:tournamentiq}
    password: ${DATABASE_PASSWORD:tournamentiq}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # The repeatable seed remains visible to Flyway so a database can switch profiles.
    placeholders:
      demo_enabled: false
    locations: classpath:db/migration,classpath:db/demo
  jackson:
    serialization:
      write-dates-as-timestamps: false

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    placeholders:
      demo_enabled: true
